[project]
name = "price-reasoner"
version = "0.1.0"
description = "AI-powered commodity price trend reasoning engine"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "prophet>=1.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
    "typer>=0.12.0",
]

[project.scripts]
price-reasoner = "price_reasoner.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]